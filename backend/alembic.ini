# Alembic 迁移配置（按「业务域 × 数据源」分清单：清单名 = 配置段名）
#
# 用法（清单名经 `-n` 指定；缺省 `[alembic]` 段即缺省清单 `platform_registry:tenant`，与基座口径一致）：
#   uv run alembic -n alembic:org:platform upgrade head   # 组织域的平台服务库
#   uv run alembic -n alembic:org:tenant upgrade head     # 组织域的租户库（组织主数据）
#
# 段名规则：`[alembic]` = 缺省清单 `platform_registry:tenant`；其余清单 = `[alembic:{domain}:{datasource}]`
# （如 `[alembic:org:tenant]`）。**业务域是架构边界，服务标识只用于库键**（07C）。
# 口径同《数据库开发规范》「迁移与建表口径」：新增业务域首次迁移时补段。
#
# 扩展参数（`-x`）：
#   -x url=<连接串>        显式覆盖连接串（优先于环境变量与配置）
#   -x db_key=tenant_mdm_demo   按库键经 url_template 解析连接串（运维通道，可跨服务）
#   -x schema=<模式名>     达梦模式切换（仅达梦方言生效）
#
# URL 一律不在此硬编码（由 alembic/env.py 经配置基座 / 环境变量读取）；
# 版本目录按清单声明在各自配置段的 `version_locations`（Alembic 在 env.py 之前读取，故必须在 ini）。
# 清单定义与表集派生见 `bms_core/db/migration.py`。

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# 路径分隔口径（新式：os.pathsep；避免 Alembic 旧式空格 / 逗号 / 冒号切分的弃用告警）
path_separator = os
# 版本目录（缺省链 platform:tenant：platform 服务 × 各租户的租户库）
version_locations = %(here)s/alembic/versions/platform/tenant
# 迁移文件命名：「序号_描述」（revision id 链内独立递增）
file_template = %%(rev)s_%%(slug)s

# 组织域（业务域 `org`，承载服务 `mdm`）三清单：租户清单承载组织主数据（`0001` ~ `0005`），
# 平台 / 归档清单为预留
[alembic:org:platform]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/alembic/versions/org/platform
file_template = %%(rev)s_%%(slug)s

[alembic:org:tenant]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/alembic/versions/org/tenant
file_template = %%(rev)s_%%(slug)s

[alembic:org:archive]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/alembic/versions/org/archive
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
