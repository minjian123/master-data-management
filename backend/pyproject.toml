# mdm 后端工作区根（uv workspace）：虚拟工程，只承载工作区成员与共享工具配置。
# 成员：services/*（各服务工程，独立 pyproject / 独立构建）。
# 共享基座：跨仓 git 源依赖 `bms-core`（锁 bms 提交 SHA，见详细设计 §4.1）；
# 依赖与安装：`uv sync` 把共享基座与服务工程以可编辑方式装入工作区 `.venv`；`uv run` 直接可用。

[tool.uv.workspace]
members = ["services/*"]

[tool.uv]
# 传递依赖约束：与平台（bms）运行锁口径对齐——SQLAlchemy 2.1 起 greenlet 不再作为默认依赖，
# 基座异步栈（`sqlalchemy.ext.asyncio`）确需 greenlet；约束到平台已验证的 2.0.x 行，避免解析漂移
constraint-dependencies = ["sqlalchemy>=2.0,<2.1"]

[tool.uv.sources]
# 共享基座库（bms 仓 `backend/libs/bms_core`）：**路径依赖**（editable）——与 mdm 平级并置的
# 工作区 bms 克隆即唯一来源，本地改基座**即时生效**（`uv run` 不会用远端快照覆盖），无需前移 rev。
# 代价与配套（2026-10-27 拍板）：
# - CI 需把 bms 浅克隆到 `../bms`（`scripts/tools/ci/bms_setup.sh`，ref 由 `BMS_REF` 锁定）；
# - 运行镜像构建上下文为**工作区根**，Dockerfile 内把 `bms/backend/libs/bms_core` COPY 到 `/opt/bms/...`，
#   使本行的相对路径在容器内同样成立（见 `deploy/Dockerfile`）。
bms-core = { path = "../../bms/backend/libs/bms_core", editable = true }
# 跨仓工程化工具包（engkit 仓）：文档链接 / 文档口径 / 预检 / 重命令包装 / 用例登记的唯一实现，
# 同样改**路径依赖**（2026-10-27 拍板，与 bms 同构）；CI 先经 `scripts/tools/ci/engkit_setup.sh`
# 克隆到 `../engkit`（ref 由 `ENGKIT_REV` 锁定）；运行镜像 `--no-dev` 不装本依赖。
engkit = { path = "../../engkit", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    # 13_07 起 ruff / pyright 的**版本**随 engkit 的 [devtools] 组下发，本仓不再另行声明
    "engkit[devtools]",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
# 规则段不在本仓声明：唯一来源是 engkit 仓 `toolchain/ruff-base.toml`（13_07），
# 相对路径按本配置文件所在目录解析；基线缺失时 ruff 直接退出码 2（不静默回落），
# 故本地与 CI 均需先有 engkit 克隆，仓内不留副本；本仓专属项仍写在此处。
extend = "../../engkit/toolchain/ruff-base.toml"
target-version = "py314"

[tool.ruff.lint.isort]
# 工作区自有包与脚本区视为第一方（与第三方依赖分组稳定，避免归类漂移）
known-first-party = [
    "mdm",
    "services",
    "ops",
    "tests_support",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["services"]
# alembic 迁移脚本不纳入类型检查（含大量动态写法）
ignore = ["alembic"]
# src 布局：把服务源码根加入解析路径，供 `import mdm` 与严格类型检查
extraPaths = ["services/org/src"]
# 共享基座 `bms-core` 为**跨仓安装包**（site-packages，未随包发布 `py.typed` 声明）：
# 缺 stub 提示降级；自有代码仍按 strict 全量检查（基座侧以源码形式纳入其本仓检查）。
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib 模式：多套同名 `tests` 目录互不冲突，测试模块按路径唯一命名
# -p engkit.coverage_plugin：入口插件（跨仓工程化工具包）——**最早**启动覆盖率采集（导入期行可采），
#   并挂上重命令 / 全量测试守卫；仓内不再另写采集或拦截实现（口径见 engkit《工程化工具包说明》§4.4）
addopts = "--import-mode=importlib -p engkit.coverage_plugin"
testpaths = [
    "services/org/tests",
    "tests",
]
pythonpath = [
    ".",
    "services/org/src",
]
markers = [
    "kiwi_id: Kiwi TCMS 用例编号（如 @pytest.mark.kiwi_id(1)）",
    "integration: 需要真实外部服务的集成用例（未配置环境时跳过）",
]
