# mdm 仓工程化工具包配置（唯一：文档根 / 工程清单 / 选测规则 / 预检步骤 / 拦截口径）
# 口径见 engkit 文档《工程化工具包说明》§4 字段表；接入步骤见同仓《接入说明》§1。

[repo]
name = "mdm"

[docs]
root = "mdm文档"

[docs.scope]
whitelist_dirs = ["规范/", "资料/", "用户文档/"]
plan_dir_pattern = "^项目/[^/]+/计划/"

[backend]
root = "backend"
groups = ["services"]
test_prefix = "test_"
projects = ["services/mdm"]
# 覆盖率门禁范围：只含产品代码。`services` 整包会把 `services/mdm/tests` 的测试代码也计入 100%
# （2026-11-14 与 msg 同口径剔除）——故 `services` 下 3 个产品模块逐个列出；新增 `services/*.py` 时同步登记。
coverage_packages = [
  "mdm",
  "ops",
  "services.form_registry",
  "services.module_registry",
  "services.table_registry",
]

[selection]
# 开发环（`测试改动内容.sh`）的依赖深度：direct = 只认直接 import，不做传递闭包
# 推送前预检固定用 closure（不受本项影响），口径见《AI开发规范》「开发环 / 推送环」
depth = "direct"
# 开发环只对改动文件跑 ruff（静态全量留推送前预检）
ruff_cmd = "uv run --project backend ruff"
ruff_config = "backend/pyproject.toml"

[frontend]
root = "frontend"
groups = ["packages", "modules"]
workspace_protocol = "workspace:"
# 前端 workspace 根在 frontend/，`-C frontend` 让 pnpm 找到 pnpm-workspace.yaml
test_cmd = "pnpm -C frontend --filter {package} test"

[rules.frontend.global]
exact = ["frontend/package.json", "frontend/pnpm-lock.yaml", "frontend/pnpm-workspace.yaml", "frontend/tsconfig.base.json", "frontend/.npmrc"]
prefixes = ["frontend/scripts/"]

[pytest]
cmd = "uv run pytest"
cwd = "backend"

[coverage]
data_env = "MDM_COVERAGE_DATA"
source_env = "MDM_COVERAGE_SOURCE"
# 门禁阈值：行 + 分支 100%，与其他仓统一、不设例外（口径定义见《AI开发规范》「覆盖率要求」节）
fail_under = 100
plugin = "engkit.coverage_plugin"
# 采集数据落点：仓内缓存目录（`.cache/` 已忽略），不落仓库根 / `backend/` 根（2026-10-25 拍板）
data_file = ".cache/coverage/.coverage"
interpreter = "uv run python"

# ---- 场景闸门（2026-10-29 拍板）：预检是**推送的内部步骤**（`engkit push`），本地不再有独立入口；
# 工作树有未提交改动（含未跟踪文件）即拒绝执行、零步骤执行——开发中改完即测走开发环入口（`测试改动内容.sh`）。
# 审计：真跑 / 被拒两类事件，一行一条 JSON（落 `.cache/`，不进 git）；写盘失败 fail-open。
[preflight.gate]
dirty_tree = true
audit_file = ".cache/preflight/audit.jsonl"

# ---- 推送入口（`engkit push` / `scripts/tools/preflight/推送.sh`）：预检通过后自动推送 ----
# 档位按**待推提交**自动选：全为 doc_globs 命中的文档 → 快速档；含代码 → 定向档。
[push]
remote = "origin"
branch = "main"
doc_globs = ["*.md", "*.txt", "*.png", "*.jpg", "*.jpeg", "*.gif", "*.svg", "*.webp", "*.pdf"]

# ---- 预检步骤（声明序即执行序；`--fast` 只跑 always，`--full` 追加 full + scoped；全量测试仅 CI）----
[[preflight.steps]]
label = "行尾：工作树 CRLF 检查（应为 LF 的文件不得残留 CRLF）"
cmd = ["uv", "run", "--project", "backend", "engkit", "eol", "--quiet"]

[[preflight.steps]]
label = "门禁冒烟：Python 版本"
cmd = ["{python}", "-c", "import sys; assert sys.version_info >= (3, 14), 'Python < 3.14'"]

[[preflight.steps]]
label = "后端静态：ruff check"
cmd = ["uv", "run", "ruff", "check", "."]
cwd = "backend"

[[preflight.steps]]
label = "后端静态：ruff format --check"
cmd = ["uv", "run", "ruff", "format", "--check", "."]
cwd = "backend"

[[preflight.steps]]
label = "后端静态：pyright"
cmd = ["uv", "run", "pyright"]
cwd = "backend"

[[preflight.steps]]
label = "门禁：check_modules（模块清单零漂移）"
cmd = ["uv", "run", "python", "-m", "ops.check_modules"]
cwd = "backend"

# 域布局生成物（deploy/boundaries/domain_layout.json）：07B 04_02 重开后由本仓清单第九类
# [[domains]] 渲染，生成物只读、不得手改；清单改了须跑 --render-domain-layout 重新生成。
[[preflight.steps]]
label = "门禁：域布局生成物零漂移（清单第九类 [[domains]] 渲染，勿手改）"
cmd = ["uv", "run", "python", "-m", "ops.check_modules", "--check-domain-layout"]
cwd = "backend"

[[preflight.steps]]
label = "门禁：check_forms（系统字段 form_key 双向一致）"
cmd = ["uv", "run", "python", "-m", "ops.check_forms"]
cwd = "backend"

[[preflight.steps]]
label = "基座：check_backend_base（继承链 / 清单 / 直继承 / 形态 / 错误码段位 / 迁移链）"
cmd = ["uv", "run", "--project", "backend", "engkit", "base", "backend-base"]

[[preflight.steps]]
label = "契约：contract_snapshot check（公开契约零漂移）"
cmd = ["uv", "run", "python", "-m", "ops.contract_snapshot", "check"]
cwd = "backend"

[[preflight.steps]]
label = "契约：contract_gate check（基线 ↔ 实时契约破坏性变更）"
cmd = ["uv", "run", "python", "-m", "ops.contract_gate", "check"]
cwd = "backend"

[[preflight.steps]]
label = "契约：event_contracts check（事件契约零漂移 + 兼容）"
cmd = ["uv", "run", "python", "-m", "ops.event_contracts", "check"]
cwd = "backend"

# 文档一致性（`engkit base docs-status`）暂不接入：存量 4 处硬规则偏差待整改
# （H6：01_02 / 01_05 / 01_06 未登记进计划表；H8：02_01 排期窗口为「待交付后安排」），
# 整改完成后把 `cmd = ["uv", "run", "engkit", "base", "docs-status"]` 加回本段。

[[preflight.steps]]
label = "界面：check_prototype_review（本次改动含界面源码须有原型对照）"
cmd = ["uv", "run", "--project", "backend", "engkit", "base", "prototype-review", "--changed", "origin/main"]

[[preflight.steps]]
label = "基座：check_env_example（环境变量模板键位）"
cmd = ["uv", "run", "--project", "backend", "engkit", "base", "env-example"]

[[preflight.steps]]
label = "文档：engkit links（链接与锚点）"
cmd = ["uv", "run", "--project", "backend", "engkit", "links"]

[[preflight.steps]]
label = "文档：engkit docs-scope（进度类字段落点）"
cmd = ["uv", "run", "--project", "backend", "engkit", "docs-scope"]

[[preflight.steps]]
label = "基座：check_bare_collections（裸无序集合护栏）"
cmd = ["uv", "run", "--project", "backend", "engkit", "base", "bare-collections"]

[[preflight.steps]]
label = "基座：check_snowflake_ids（裸 BigInteger 雪花 ID 列 / schema 残留）"
cmd = ["uv", "run", "--project", "backend", "engkit", "base", "snowflake-ids"]

[[preflight.steps]]
label = "后端测试：定向（选测 + 覆盖率门禁 + 扩圈）"
type = "scoped_tests"
preset = "scoped"

[[preflight.steps]]
label = "后端测试：聚合全量（--full；仅 CI；含行 + 分支 100% 覆盖率门禁）"
type = "full_tests"
preset = "full"

[guard]
scripts = []
repo_dirs = ["services", "ops", "alembic"]
dir_test_threshold = 20
# 一律视为全量测试的目录前缀（相对 pytest 工作目录 backend；命中即拦，不受文件数阈值影响）
full_test_dirs = []


# ---- 基座校验器规则（`engkit base <名>`；缺段 = 该校验器未启用）----

[rules.test_db_isolation]
# 测试库隔离静态护栏（任务 04-6-1/04-6-2）：单库叠加口径下禁止为图省事自建 SQLite / 裸 int ID / 清理他人数据
scan_targets = ["backend/services", "backend/tests", "backend/tests_support"]
allow_marker = "own_db"
db_literal_prefixes = ["sqlite+aiosqlite:///", "sqlite:///"]
engine_factories = ["create_async_engine", "create_engine"]
db_file_suffixes = [".db"]
id_columns = ["id"]
cleanup_calls = ["drop_all"]
exclude_parts = ["__pycache__", ".venv", "node_modules", ".git"]
# 共享测试基座：职责就是建库（04-6-2 单源准备集），不参与「用例自建库」判定
base_modules = ["backend/tests_support/shared_db.py"]

[rules.env_example]
private_key_marker = "PRIVATE KEY"
placeholder_marker = "..."

[[rules.env_example.templates]]
path = "deploy/.env.example"
required_keys = [
  "PLATFORM_NETWORK",
  "MDM_REGISTRY_IMAGE_PREFIX",
  "MDM_TAG",
  "BMS_DATABASE__PLATFORM__URL_TEMPLATE",
  "BMS_REDIS__URL",
  "BMS_SERVICE_TOKEN__KEYS",
]

[rules.docs_status]
project_dir = "mdm文档/项目"
stage = "01_mdm 产品奠基"
statuses = ["未开始", "进行中", "部分完成", "已完成", "搁置"]
todo_statuses = ["未开始", "进行中", "部分完成", "搁置"]
done_status = "已完成"
req_id_pattern = '^\d{2}-\d+$'
task_id_pattern = '^\d{2}-\d+-\d+$'
plan_id_pattern = '^\d{2}_\d{2}$'

[rules.prototype]
record_pattern = '^mdm文档/项目/[^/]+/任务/.+/测试/[^/]+\.md$'
context_pattern = '^mdm文档/项目/[^/]+/任务/.+/(设计|实施|测试)/[^/]+\.md$'
prototype_ref_pattern = '(设计/(?:原型设计|组件设计)/[^\s()\[\]"`<>|{},]*\.html)'
ui_patterns = ['^frontend/.*\.vue$']
section_heading = '^##.*原型'
screenshot_pattern = '\]\(([^)\s]+\.png)\)'
unfinished_words = ["待补", "待对照", "待核", "未核对", "待定", "TODO", "待办"]
base = "origin/main"

[rules.backend_base]
# 产品仓形态：清单 / 契约自持（只登记本仓继承类与链），父类经 bms 的基座源码面解析，
# 链必须接到平台体系根；错误码按产品码（6 位，段位取自服务行 errcode_segment）判定。
profile = "product"
manifest = "mdm文档/后端基类清单.md"
chain_doc = "mdm文档/设计/基类体系/后端基类实现契约.md"
source_dirs = ["backend/services"]
base_source_dirs = ["../bms/backend/libs/bms_core/src"]
error_codes = "backend/services/mdm/src/mdm/errors.py"
versions_dir = "backend/alembic/versions"
direct_baseline = "deploy/boundaries/direct_base_object_baseline.json"
root_bases_marker = "体系根清单"
value_object_root = "BaseValueObject"
framework_object_root = "BaseFrameworkObject"
datasources = ["platform", "tenant", "archive"]
default_chain = "platform:tenant"
domain_layout = "deploy/boundaries/domain_layout.json"
error_code_segment = "33"

# ---- 基座护栏：裸无序集合（07D 收口接入；形态定义与 bms 同源，扫描根本仓自持）----
[rules.bare_collections]
scan_targets = ["backend/services"]
exclude_parts = ["__pycache__", ".venv", "node_modules", ".git"]
whitelist = [
  "ConcurrentStableList",
  "ConcurrentStableSet",
  "ConcurrentStableDict",
  "ConcurrentStableFrozenList",
  "ConcurrentStableFrozenSet",
  "ConcurrentStableFrozenDict",
]
unregistered = [
  "deque",
  "Deque",
  "Counter",
  "OrderedDict",
  "ChainMap",
  "defaultdict",
  "UserDict",
  "UserList",
  "UserString",
  "KeysView",
  "ItemsView",
  "ValuesView",
  "MappingView",
]
tuple_forms = ["tuple", "Tuple"]
protocol_forms = [
  "Iterable",
  "Iterator",
  "Generator",
  "AsyncIterator",
  "AsyncIterable",
  "AsyncGenerator",
  "Callable",
  "Awaitable",
  "Coroutine",
  "Reversible",
  "Container",
  "Sized",
  "Hashable",
]
# 本仓无集合体系实现文件（实现全在平台 bms_core），故为空
implementation_files = []
allow_marker = "# bare-collections:allow"
baseline = "deploy/boundaries/bare_collections_baseline.json"

[rules.bare_collections.banned]
bare = ["dict", "list", "set", "frozenset", "Dict", "List", "Set", "FrozenSet", "DefaultDict"]
readonly = [
  "Sequence",
  "Mapping",
  "AbstractSet",
  "Collection",
  "MutableSequence",
  "MutableMapping",
  "MutableSet",
]
ascending = [
  "SortedList",
  "SortedDict",
  "SortedSet",
  "ConcurrentSortedList",
  "ConcurrentSortedSet",
  "ConcurrentSortedDict",
]

[rules.bare_collections.reasons]
tuple = "同构 tuple 视为集合声明，请落 ConcurrentStableList（值对象字段落 ConcurrentStableFrozenList）"
bare_tuple = "裸 tuple 无元素类型信息，请写明元素类型后按同构 / 固定元数判定"
banned = "集合声明须命中白名单（插入序 ConcurrentStable* / 不可变 ConcurrentStableFrozen*）"
unregistered = "未登记的集合形态：请先登记护栏白名单与《后端基类清单》，或改用插入序集合类"

# ---- 基座护栏：雪花 ID（口径同 bms：ID 列一律 SnowflakeId，BigInteger 仅计数 / 度量）----
[rules.snowflake_ids]
scan_targets = ["backend/services"]
id_names = ["id", "tenant_scope", "rolled_back_from"]
id_suffixes = ["_id", "_by"]
# 本仓暂无计数 / 度量列的 BigInteger 例外；新增须逐条写明用途
whitelist = []
