# mdm 仓工程化工具包配置（唯一：文档根 / 工程清单 / 选测规则 / 预检步骤 / 拦截口径）
# 口径见 engkit 文档《工程化工具包说明》§4 字段表；接入步骤见同仓《接入说明》§1。

[repo]
name = "mdm"

[docs]
root = "mdm文档"

[docs.scope]
whitelist_dirs = ["规范/", "资料/", "用户文档/"]
plan_dir_pattern = "^项目/[^/]+/计划/"

[backend]
root = "backend"
groups = ["services"]
test_prefix = "test_"
projects = ["services/org"]
coverage_packages = ["mdm", "services", "ops"]

[selection]
# 开发环（`测试改动内容.sh`）的依赖深度：direct = 只认直接 import，不做传递闭包
# 推送前预检固定用 closure（不受本项影响），口径见《AI开发规范》「开发环 / 推送环」
depth = "direct"
# 开发环只对改动文件跑 ruff（静态全量留推送前预检）
ruff_cmd = "uv run --project backend ruff"
ruff_config = "backend/pyproject.toml"

[frontend]
root = "frontend"
groups = ["packages", "modules"]
workspace_protocol = "workspace:"
# 前端 workspace 根在 frontend/，`-C frontend` 让 pnpm 找到 pnpm-workspace.yaml
test_cmd = "pnpm -C frontend --filter {package} test"

[rules.frontend.global]
exact = ["frontend/package.json", "frontend/pnpm-lock.yaml", "frontend/pnpm-workspace.yaml", "frontend/tsconfig.base.json", "frontend/.npmrc"]
prefixes = ["frontend/scripts/"]

[pytest]
cmd = "uv run pytest"
cwd = "backend"

[coverage]
data_env = "MDM_COVERAGE_DATA"
source_env = "MDM_COVERAGE_SOURCE"
# 门禁阈值：行 + 分支 100%，与其他仓统一、不设例外（口径定义见《AI开发规范》「覆盖率要求」节）
fail_under = 100
plugin = "engkit.coverage_plugin"
# 采集数据落点：仓内缓存目录（`.cache/` 已忽略），不落仓库根 / `backend/` 根（2026-10-25 拍板）
data_file = ".cache/coverage/.coverage"
interpreter = "uv run python"

# ---- 预检步骤（声明序即执行序；`--fast` 只跑 always，`--full` 追加 full）----
[[preflight.steps]]
label = "行尾：工作树 CRLF 检查（应为 LF 的文件不得残留 CRLF）"
cmd = ["uv", "run", "engkit", "eol", "--quiet"]

[[preflight.steps]]
label = "门禁冒烟：Python 版本"
cmd = ["{python}", "-c", "import sys; assert sys.version_info >= (3, 14), 'Python < 3.14'"]

[[preflight.steps]]
label = "后端静态：ruff check"
cmd = ["uv", "run", "ruff", "check", "."]
cwd = "backend"

[[preflight.steps]]
label = "后端静态：ruff format --check"
cmd = ["uv", "run", "ruff", "format", "--check", "."]
cwd = "backend"

[[preflight.steps]]
label = "后端静态：pyright"
cmd = ["uv", "run", "pyright"]
cwd = "backend"

[[preflight.steps]]
label = "门禁：check_modules（模块清单零漂移）"
cmd = ["uv", "run", "python", "-m", "ops.check_modules"]
cwd = "backend"

[[preflight.steps]]
label = "门禁：check_forms（系统字段 form_key 双向一致）"
cmd = ["uv", "run", "python", "-m", "ops.check_forms"]
cwd = "backend"

[[preflight.steps]]
label = "契约：contract_snapshot check（公开契约零漂移）"
cmd = ["uv", "run", "python", "-m", "ops.contract_snapshot", "check"]
cwd = "backend"

[[preflight.steps]]
label = "契约：contract_gate check（基线 ↔ 实时契约破坏性变更）"
cmd = ["uv", "run", "python", "-m", "ops.contract_gate", "check"]
cwd = "backend"

[[preflight.steps]]
label = "契约：event_contracts check（事件契约零漂移 + 兼容）"
cmd = ["uv", "run", "python", "-m", "ops.event_contracts", "check"]
cwd = "backend"

# 文档一致性（`engkit base docs-status`）暂不接入：存量 4 处硬规则偏差待整改
# （H6：01_02 / 01_05 / 01_06 未登记进计划表；H8：02_01 排期窗口为「待交付后安排」），
# 整改完成后把 `cmd = ["uv", "run", "engkit", "base", "docs-status"]` 加回本段。

[[preflight.steps]]
label = "界面：check_prototype_review（本次改动含界面源码须有原型对照）"
cmd = ["uv", "run", "engkit", "base", "prototype-review", "--changed", "origin/main"]

[[preflight.steps]]
label = "基座：check_env_example（环境变量模板键位）"
cmd = ["uv", "run", "engkit", "base", "env-example"]

[[preflight.steps]]
label = "后端测试：定向（选测 + 覆盖率门禁 + 扩圈）"
type = "scoped_tests"
preset = "scoped"

[[preflight.steps]]
label = "后端测试：聚合全量（--full；含行 + 分支 100% 覆盖率门禁）"
type = "full_tests"
preset = "full"

[runonce]
cache_dir = ".cache/run-once"
window_seconds = 1800

[guard]
scripts = []
repo_dirs = ["services", "ops", "alembic"]
dir_test_threshold = 20


# ---- 基座校验器规则（`engkit base <名>`；缺段 = 该校验器未启用）----

[rules.env_example]
private_key_marker = "PRIVATE KEY"
placeholder_marker = "..."

[[rules.env_example.templates]]
path = "deploy/.env.example"
required_keys = [
  "PLATFORM_NETWORK",
  "MDM_REGISTRY_IMAGE_PREFIX",
  "MDM_TAG",
  "BMS_DATABASE__PLATFORM__URL_TEMPLATE",
  "BMS_REDIS__URL",
  "BMS_SERVICE_TOKEN__KEYS",
]

[rules.docs_status]
project_dir = "mdm文档/项目"
stage = "01_mdm 产品奠基"
statuses = ["未开始", "进行中", "部分完成", "已完成", "搁置"]
todo_statuses = ["未开始", "进行中", "部分完成", "搁置"]
done_status = "已完成"
req_id_pattern = '^\d{2}-\d+$'
task_id_pattern = '^\d{2}-\d+-\d+$'
plan_id_pattern = '^\d{2}_\d{2}$'

[rules.prototype]
record_pattern = '^mdm文档/项目/[^/]+/任务/.+/测试/[^/]+\.md$'
context_pattern = '^mdm文档/项目/[^/]+/任务/.+/(设计|实施|测试)/[^/]+\.md$'
prototype_ref_pattern = '设计/((?:原型设计|组件设计)/[^\s()\[\]"`<>|]*\.html)'
ui_patterns = ['^frontend/.*\.vue$']
section_heading = '^##.*原型'
screenshot_pattern = '\]\(([^)\s]+\.png)\)'
unfinished_words = ["待补", "待对照", "待核", "未核对", "待定", "TODO", "待办"]
base = "origin/main"
