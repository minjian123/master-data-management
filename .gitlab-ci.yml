# MDM 主数据仓库流水线
# 现状：产品工程骨架与平台接入（01_01）+ 组织主数据域实现（01_02）——uv workspace + mdm 服务（五表 + 管理面端点）
#       + 运维脚本 + 公开契约快照 + 事件契约快照 + **前端工作区（01_04：组织域运行时模块 + 契约类型包）**
#       + **运行镜像构建与推送（01_07：首次部署）**。
# 门禁：门禁冒烟（无条件必跑）/ ruff / pyright（strict）/ pytest + 覆盖率（engkit 采集口径）/ 离线清单 +
#       公开契约零漂移 + 事件契约零漂移 + 文档（链接与锚点 / 文档口径，跨仓工程化工具包 engkit）
#       + 前端（契约类型零漂移 / 类型检查 / lint / 用例 / 模块构建体积预算与产物面隔离）
#       + 镜像（按 SHA 推 GitLab Registry）。
# 未启用（随后续任务引入）：镜像扫描、三库（MySQL / PostgreSQL / DM8）集成、服务子流水线、E2E、Allure。

workflow:
  rules:
    # 触发口径（2026-10-26 用户拍板，与 bms / engkit 同口径）：**推送不触发流水线**——日常验证以推送前的
    # 本地预检为准，CI 只作按需的全量 / 集成验证，**手工触发即全量**（GitLab 界面 Run pipeline 或
    # `POST /projects/<id>/pipeline`；bms 仓 `scripts/tools/ci/trigger.py` 可按仓复用）。
    # 因此推送**无需**再加 `-o ci.skip`。
    # 注意：bms文档 为工作区软链，CI 只 clone mdm 时不可用，故只校验 mdm 仓库自身内容。
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

stages:
  - lint
  - test
  - build

default:
  tags: [mdm]
  image: python:3.14-slim

variables:
  # 内网加速源（与 bms 侧 CI 同口径）；uv 以 copy 硬链接模式装入工作区 venv（跨挂载点安全）
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
  UV_LINK_MODE: copy
  # 流水线级串行闸门（2026-10-09）：与 bms 仓**同键**（两仓共用 mjbk 上同一台 runner 的宿主 docker daemon）
  CI_QUEUE_LOCK: ci-queue-lock
  CI_QUEUE_STALE_SECONDS: "7200"

# ---- 流水线级串行闸门（2026-10-09）----
# 口径与实现见 bms 仓 `.gitlab-ci.yml` 同名小节：mjbk 上仅一台 runner（实例级 id 2），bms 与 mdm 共用，
# 默认两仓流水线并行会互相抢资源；GitLab 原生无「整条流水线互斥」开关（`resource_group` 是作业级且不跨
# 项目），故以两仓共用 runner 的**宿主 docker daemon**（`/var/run/docker.sock` 已挂进所有作业）为互斥介质：
# **同名锁容器即互斥量**（`CI_QUEUE_LOCK` 两仓必须一致）；`.pre` 取锁 / 等待，`.post` 释放；
# 持锁超 `CI_QUEUE_STALE_SECONDS` 视为陈旧可接管；异常残留时以 `CI_QUEUE_FORCE=1` 强制接管。
# 闸门镜像仅需 docker CLI（不依赖 mdm 的业务镜像与依赖，故 mdm 侧其它 job 的既有问题不影响闸门）。
ci-queue-acquire:
  stage: .pre
  image: docker:27-cli
  script:
    - |
      set -u
      STALE="${CI_QUEUE_STALE_SECONDS:-7200}"
      LOCK="${CI_QUEUE_LOCK:-ci-queue-lock}"
      ME="${CI_PROJECT_PATH}#${CI_PIPELINE_ID}"
      owner() { docker inspect -f '{{index .Config.Labels "ci-queue.owner"}}' "$LOCK" 2>/dev/null || echo ''; }
      stamp() { docker inspect -f '{{index .Config.Labels "ci-queue.at"}}' "$LOCK" 2>/dev/null || echo 0; }
      if [ "${CI_QUEUE_FORCE:-}" = "1" ]; then
        echo "[ci-queue] CI_QUEUE_FORCE=1 ⇒ 强制接管上一把锁（人工兜底）"
        docker rm -f "$LOCK" >/dev/null 2>&1 || true
      fi
      while :; do
        if docker inspect "$LOCK" >/dev/null 2>&1; then
          OWNER="$(owner)"
          AGE=$(( $(date +%s) - $(stamp) ))
          if [ "$AGE" -ge "$STALE" ]; then
            echo "[ci-queue] 锁陈旧（owner=${OWNER}，持锁 ${AGE}s ≥ ${STALE}s）⇒ 接管"
            docker rm -f "$LOCK" >/dev/null 2>&1 || true
            continue
          fi
          echo "[ci-queue] 等待上一条流水线结束：owner=${OWNER}（持锁 ${AGE}s）"
          sleep 15
          continue
        fi
        if docker create --name "$LOCK" \
          --label "ci-queue.owner=$ME" --label "ci-queue.at=$(date +%s)" \
          python:3.14-slim true >/dev/null 2>&1; then
          echo "[ci-queue] 已获得流水线锁：$ME"
          break
        fi
        sleep 5
      done

ci-queue-release:
  stage: .post
  when: always
  interruptible: false
  image: docker:27-cli
  script:
    - |
      LOCK="${CI_QUEUE_LOCK:-ci-queue-lock}"
      ME="${CI_PROJECT_PATH}#${CI_PIPELINE_ID}"
      OWNER="$(docker inspect -f '{{index .Config.Labels "ci-queue.owner"}}' "$LOCK" 2>/dev/null || echo '')"
      if [ "$OWNER" = "$ME" ]; then
        docker rm -f "$LOCK" >/dev/null 2>&1 || true
        echo "[ci-queue] 已释放流水线锁：$ME"
      else
        echo "[ci-queue] 锁不属于本流水线（owner=${OWNER:-无}），跳过释放"
      fi

# ---- 门禁冒烟：所有流水线无条件必跑 ----
gate-smoke:
  stage: lint
  script:
    - python --version
    - python -c "import sys; assert sys.version_info >= (3, 14), 'Python < 3.14'"
    - echo "gate ok"

# ---- 后端门禁（backend/ 工作区）----
# 依赖安装：`bms-core` 为**路径依赖**（2026-10-27 起，见 `backend/pyproject.toml` 的 `[tool.uv.sources]`），
# `uv sync --frozen` 按 `../../bms/backend/libs/bms_core` 装基座 → 后端 job 必须先克隆 bms 到 `../bms`；
# 基座 ref 由变量 `BMS_REF` 指定（**缺省 main = 每次取 bms 远端 main 头，日常零维护**；`latest-tag` 取最新
# `vX.Y.Z` 标签；也可给分支 / tag / SHA 钉版本，见 `scripts/tools/ci/bms_setup.sh` 与 bms 仓
# `scripts/tools/ci/bms_ref.py`）。
# `engkit` 仍为 git 源依赖（锁提交 SHA），由 `engkit_setup.sh` + `uv sync` 两条路径分别满足。

.backend-setup: &backend-setup
  # python:3.14-slim 不含 git，而 `bms_setup.sh` / `engkit_setup.sh` 都要 git 克隆（2026-10-28 修复：
  # 先前 job 直接 `git: command not found` 退出 127）；`nodejs` + `libatomic1` 供 pyright 使用——
  # pyright 无系统 node 时会用 nodeenv 现下 node，CI 里下载失败（2026-10-28 #1283 实测
  # `RuntimeError: nodeenv failed`），装系统 node 即直连。apt 走清华镜像
  - sed -i 's|deb.debian.org|mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list.d/debian.sources
  - apt-get update && apt-get install -y --no-install-recommends git ca-certificates nodejs libatomic1
  - pip install --no-cache-dir uv
  # bms 基座克隆（路径依赖前置）
  - . scripts/tools/ci/bms_setup.sh
  # engkit 克隆（13_07）：ruff 规则基线在 engkit 仓 `toolchain/ruff-base.toml`，ruff 的 `extend` 读的是
  # **文件路径**（读不了安装包内资源），故后端 job 统一先克隆；脚本按锁定 SHA 检出并导出 ENGKIT_HOME。
  # `uv sync --frozen` 另按 pyproject 的 rev 拉 engkit 包（提供 ruff / pyright 版本）——两条路径都要有。
  - . scripts/tools/ci/engkit_setup.sh
  - cd backend
  - uv sync --frozen

backend-lint:
  stage: lint
  script:
    - *backend-setup
    - uv run ruff check .
    - uv run ruff format --check .

# ---- 文档门禁（跨仓工程化工具包 engkit，13_05 接入）----
# 口径：文档相对链接与锚点必须自洽；进度类字段（工时 / 排期 / 里程碑等）只允许落在阶段计划，
# 确属引用规范原文或描述落点的行以行内 `docs-scope:allow:理由` 豁免。
# 两项各自独立成 job：失败归因清晰（断链 / 口径违规分别报），不混在门禁冒烟里。
docs-links:
  stage: lint
  script:
    - *backend-setup
    # CI 只 clone mdm 时 `bms文档` 软链不存在，跨仓相对链接（`../bms文档/…`）会全判断链（2026-10-28 实测 155 处）；
    # bms 已由 `bms_setup.sh` 克隆到 `../bms`，按本地工作区布局补软链再查（cwd 为 backend，软链建在 mdm 仓根）
    - ln -sfn ../bms/bms文档 ../bms文档
    - uv run engkit links --root ..

docs-scope:
  stage: lint
  script:
    - *backend-setup
    - uv run engkit docs-scope --root ..

backend-typecheck:
  stage: lint
  script:
    - *backend-setup
    - uv run pyright

backend-test:
  stage: test
  variables:
    BMS_ENV: test
    # 覆盖率采集口径（01_07）：与本地预检同源——`engkit.coverage_plugin` 按 `MDM_COVERAGE_DATA` 落盘
    # （xdist worker 各落 `<基址>.<pid>`），再由 `engkit coverage` 合并判定，不再用 `pytest --cov`。
    # 键位与 `engkit.toml` 的 `[coverage]` 一致；源范围 = 被测包（mdm / services / ops）。
    MDM_COVERAGE_DATA: $CI_PROJECT_DIR/.cache/coverage/.coverage
    MDM_COVERAGE_SOURCE: mdm,services,ops
  script:
    - *backend-setup
    # 测试库隔离（2026-11-05）：runner 工作区跨作业 / 跨流水线复用，共享测试库
    # （`.cache/test/{platform,tenant}.db`）会残留上一轮数据；本次起 mdm 自己的 `pytest_sessionstart`
    # 会在会话开始清库，这里再显式清一次目录与全部 `*.db`，双保险（防止清理失败时静默沿用旧库）。
    - rm -rf "$CI_PROJECT_DIR/.cache/test" "$CI_PROJECT_DIR/.cache/coverage"
    - find "$CI_PROJECT_DIR" -name '*.db' -not -path '*/.git/*' -delete
    - find "$CI_PROJECT_DIR" -name '*.db-journal' -not -path '*/.git/*' -delete
    # 覆盖率硬门禁：行 + 分支 100%（与其他仓统一，不设例外）；判定在 `engkit coverage` 内完成
    - uv run pytest
    - >-
      uv run engkit coverage
      --root "$CI_PROJECT_DIR"
      --data-file "$MDM_COVERAGE_DATA"
      --out "$CI_PROJECT_DIR/coverage.json"
      --module mdm --module services --module ops
      --fail-under 100
  coverage: '/percent=(\d+(?:\.\d+)?)/'
  artifacts:
    when: always
    paths: [coverage.json]
    expire_in: 30 days

backend-modules:
  stage: test
  script:
    - *backend-setup
    - uv run python -m ops.check_modules
    # 系统字段 `form_key`：产品清单 ↔ 模型双向一致 + 同名闭合 + 关联表不落字段（mdm `01_02/_04`）
    - uv run python -m ops.check_forms
    - uv run python -m ops.contract_snapshot check
    # 契约门禁：基线 ↔ 实时公开契约破坏性变更比对（--engine auto：docker 可用走 oasdiff，否则内置结构化判定）
    - uv run python -m ops.contract_gate check
    - uv run python -m ops.event_contracts check

# ---- 前端门禁（frontend/ 工作区）----
# **构建前提（跨仓）**：平台基座包（`@bms/core` / `@bms/ui_ep` / `@bms/api_types`）经 `file:` 引工作区
# **bms 克隆**，且 bms 前端包纳入本工作区成员（见任务 01_04 详细设计 §3.2）——故前端作业先经
# `scripts/tools/ci/bms_setup.sh` 克隆 bms 到与 mdm **同级**目录（`../bms`），与后端作业**同一份 ref 口径**
# （`BMS_REF` 缺省跟随 bms main 头；`latest-tag` / 分支 / tag / SHA 可钉）。`BMS_REPO_URL` 可覆写仓库地址。
#
# 门禁面：契约类型零漂移 / 类型检查 / lint / 用例 / 模块构建（体积预算 + 产物面隔离）。

.frontend-setup: &frontend-setup
  - corepack enable
  - node --version
  - . scripts/tools/ci/bms_setup.sh
  - cd frontend
  - pnpm install --frozen-lockfile

frontend-lint:
  stage: lint
  image: node:24
  script:
    - *frontend-setup
    - pnpm run lint
    - pnpm run api-types:typecheck
    - pnpm run mdm:typecheck

frontend-test:
  stage: test
  image: node:24
  script:
    - *frontend-setup
    # 契约类型零漂移（生成物 ↔ 产品契约快照逐字节比对）
    - pnpm run api-types:gen:check
    - pnpm run api-types:test
    # 模块用例 + 覆盖率采集（行 + 分支；门禁阈值口径见《AI开发规范》「覆盖率要求」节，
    # 本地按变更源文件 `--coverage.include=… --coverage.thresholds.lines=100 --coverage.thresholds.branches=100` 收口）
    - pnpm --filter @mdm/module_mdm run test:cov
  coverage: '/^All files\s*\|\s*(\d+(?:\.\d+)?)/'
  artifacts:
    when: always
    paths: [frontend/modules/mdm/coverage/]
    expire_in: 30 days

frontend-build:
  stage: test
  image: node:24
  script:
    - *frontend-setup
    - pnpm run mdm:build
    # 体积预算（复用平台 module-metrics 单一计量）
    - pnpm run mdm:budget
    # 产物面隔离扫描（平台护栏同判据）
    - pnpm run mdm:guard
  artifacts:
    # 部署侧用（01_07）：服务器不装 node / pnpm，按 SHA 取本产物后经 `node:24` 容器跑
    # bms `release-module.mjs publish`（四关校验 + 清单登记）。归档「模块工程元数据 + 产物」两件：
    # 发布脚本要读 `package.json` 判定模块名 / 版本，只给 dist 会被拒（缺工程清单）。
    when: on_success
    paths:
      - frontend/modules/mdm/dist/
      - frontend/modules/mdm/package.json
    expire_in: 30 days

# ---- 运行镜像：按 SHA 构建并推 GitLab Registry（01_07 首次部署）----
# 口径：
# - 构建上下文是**仓库父目录**（`mdm/` 与 `bms/` 平级）：`bms-core` 为路径依赖，镜像需同时含
#   `mdm/` 与 `bms/backend/libs/bms_core`，Docker 只能从单一上下文取其内容；
# - 排除规则随仓库走（`mdm/deploy/Dockerfile.dockerignore`，Dockerfile 专用 ignore）；
# - 凭据用 CI 预定义 `CI_REGISTRY_USER` / `CI_REGISTRY_PASSWORD`（本项目无需项目级变量）；
# - `--provenance=false`：BuildKit 默认 attestation 清单推送会被 GitLab Registry 拒绝（blob unknown，bms 实测）；
# - 镜像名与部署侧口径一致：`${MDM_REGISTRY_IMAGE_PREFIX}/mdm:<sha>`，缺省前缀取 `$CI_REGISTRY_IMAGE`。
image-build:
  stage: build
  image: docker:27-cli
  script:
    # docker:27-cli 是 alpine 基底，无 git；bms_setup.sh 需要它（apt 不可用，走 apk）
    - >-
      sed -i 's|dl-cdn.alpinelinux.org|mirrors.tuna.tsinghua.edu.cn|g' /etc/apk/repositories
      && apk add --no-cache git
    - . scripts/tools/ci/bms_setup.sh
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - IMAGE="${MDM_REGISTRY_IMAGE_PREFIX:-$CI_REGISTRY_IMAGE}/mdm:$CI_COMMIT_SHORT_SHA"
    - echo "[image] 构建 $IMAGE（上下文 = 仓库父目录）"
    - cd ..
    - docker build --provenance=false -f mdm/deploy/Dockerfile -t "$IMAGE" .
    - docker push "$IMAGE"
    - echo "[image] 已推送 $IMAGE"

