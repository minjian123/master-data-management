<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 岗位分配（用户记录页）</title>
<link rel="stylesheet" href="../../../../bms文档/设计/原型设计/资源/vendor/element-plus.css">
<link rel="stylesheet" href="../../../../bms文档/设计/原型设计/资源/原型样式.css">
<style>
  .host-shell { background:#fff; border:1px solid #d0d7de; border-radius:6px; padding:16px; }
  .host-bar { display:flex; align-items:center; gap:12px; padding-bottom:12px; border-bottom:1px dashed #d0d7de; margin-bottom:12px; }
  .host-title { font-weight:600; }
  .slot-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .slot-name { font-weight:600; margin-right:auto; }
  .ep-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">组织域插件 · 岗位分配（用户记录页「用户分配」页签内子页签）</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="host-shell">
      <div class="host-bar">
        <span class="host-title">模拟宿主页 · 用户记录页 →「用户分配」页签</span>
        <el-tag size="small" type="info">张三 / zhangsan</el-tag>
        <span class="proto-hint">宿主提供作用对象标识；插件只读；本插件渲染在「用户分配」页签内的子页签（与 角色分配 / 用户分配部门 并列）</span>
      </div>

      <el-tabs v-model="activeTab">
        <el-tab-pane label="账号信息" name="info">
          <el-descriptions :column="2" border>
            <el-descriptions-item label="用户名">zhangsan</el-descriptions-item>
            <el-descriptions-item label="姓名">张三</el-descriptions-item>
            <el-descriptions-item label="状态">启用</el-descriptions-item>
            <el-descriptions-item label="手机号">138****8000</el-descriptions-item>
          </el-descriptions>
        </el-tab-pane>

        <el-tab-pane label="岗位分配" name="posts">
          <el-alert v-if="demoState === 'offline'" type="info" :closable="false"
            title="插件未加载：本页签整体不渲染，页面其余部分照常（不报错、不阻塞）"></el-alert>

          <el-alert v-else-if="demoState === 'no-context'" type="warning" :closable="false"
            title="上下文缺失：未取得作用对象信息，本次不发起请求"></el-alert>

          <template v-else>
            <el-alert type="success" :closable="false" show-icon
              title="数据归组织主数据域：分配与解绑即时提交（不随宿主页面保存）"
              description="每次提交按勾选结果整体覆盖该用户的岗位分配；未勾选项即解绑。"></el-alert>

            <div class="ep-toolbar" style="margin-top:12px">
              <el-button type="primary" @click="openAssign">分配岗位</el-button>
              <el-button @click="refresh">刷新</el-button>
              <span class="ep-side" style="margin-left:auto">
                <span class="proto-hint">降级演示：</span>
                <el-button size="small" @click="demoState = 'offline'">插件未加载</el-button>
                <el-button size="small" @click="demoState = 'no-context'">上下文缺失</el-button>
                <el-button size="small" type="primary" plain @click="demoState = ''">恢复</el-button>
              </span>
            </div>

            <el-table :data="assignedRows" border stripe style="width:100%">
              <el-table-column prop="code" label="岗位码" min-width="130"></el-table-column>
              <el-table-column prop="name" label="名称" min-width="130"></el-table-column>
              <el-table-column prop="dept" label="归属部门" min-width="120"></el-table-column>
              <el-table-column label="主要" width="80">
                <template #default="{ row }">
                  <el-radio :model-value="primaryId" :value="row.id" @change="onPrimary(row)"></el-radio>
                </template>
              </el-table-column>
              <el-table-column label="状态" width="100">
                <template #default="{ row }">
                  <el-tag :type="row.status === 'enabled' ? 'success' : 'info'">{{ row.status === 'enabled' ? '启用' : '停用' }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="操作" width="110">
                <template #default="{ row }">
                  <el-button link type="danger" @click="unbind(row)">解绑</el-button>
                </template>
              </el-table-column>
              <template #empty>
                <el-empty description="该用户暂无岗位">
                  <el-button size="small" type="primary" @click="openAssign">去分配</el-button>
                </el-empty>
              </template>
            </el-table>

            <p class="proto-hint" style="margin-top:8px">
              主体链：用户 → 岗位 → 角色；分配岗位后，用户经该岗位获得岗位绑定的角色权限。
            </p>
            <p class="proto-hint" style="margin-top:4px">
              <b>「主要」</b>＝该用户所属岗位的默认归属（同用户<b>至多一个</b>）：点选即提交（<b>即时生效，不随宿主保存</b>），再次点选同一项即取消；分配集合变动致该条解绑时主要标记随之清空。<b>主要岗位不参与角色解析</b>（权限按全部已分配岗位计算）。
            </p>
          </template>
        </el-tab-pane>

        <el-tab-pane label="登录记录" name="logs">
          <el-empty description="非本期范围（宿主页内建页签）"></el-empty>
        </el-tab-pane>
      </el-tabs>
    </div>

    <el-dialog v-model="dlg.visible" title="分配岗位（全量覆盖）" width="560">
      <el-form label-position="top">
        <el-form-item label="筛选部门">
          <el-select v-model="dlg.dept" placeholder="全部部门" clearable style="width:100%" @change="onDeptChange">
            <el-option label="技术部" value="技术部"></el-option>
            <el-option label="财务部" value="财务部"></el-option>
            <el-option label="人事部" value="人事部"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="岗位（多选）">
          <el-select v-model="dlg.picked" multiple placeholder="选择岗位" style="width:100%">
            <el-option v-for="p in dlgOptions" :key="p.id" :label="p.name + '（' + p.dept + '）'" :value="p.id"
              :disabled="p.status === 'disabled'"></el-option>
          </el-select>
        </el-form-item>
      </el-form>
      <el-alert type="warning" :closable="false"
        title="保存后按勾选结果整体覆盖该用户现有岗位分配；未勾选项自动解绑。"></el-alert>
      <template #footer>
        <el-button @click="dlg.visible = false">取消</el-button>
        <el-button type="primary" @click="saveAssign">保存并提交</el-button>
      </template>
    </el-dialog>
  </div>
</div>

<script src="../../../../bms文档/设计/原型设计/资源/vendor/vue.global.prod.js"></script>

<script src="../../../../bms文档/设计/原型设计/资源/vendor/element-plus.min.js"></script>
<script src="../../../../bms文档/设计/原型设计/资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var activeTab = ref('posts');
      var demoState = ref('');
      var posts = ref([
        { id: 1, code: 'engineer', name: '工程师', dept: '技术部', status: 'enabled' },
        { id: 2, code: 'accountant', name: '会计', dept: '财务部', status: 'enabled' },
        { id: 3, code: 'tester', name: '测试', dept: '技术部', status: 'disabled' },
        { id: 4, code: 'hr', name: '人事专员', dept: '人事部', status: 'enabled' }
      ]);
      var assignedIds = ref([1]);
      var primaryId = ref(1);
      var dlg = reactive({ visible: false, dept: '', picked: [] });

      function toastMsg(m, type) {
        var opts = { message: m };
        if (type) { opts.type = type; opts.duration = 2000; }
        Vue.ElMessage(opts);
      }
      function confirmAction(msg, fn, okText) {
        Vue.ElMessageBox.confirm(msg, '确认操作', { type: 'warning', confirmButtonText: okText || '确定', cancelButtonText: '取消' })
          .then(function () { fn(); }).catch(function () {});
      }
      var assignedRows = computed(function () {
        return posts.value.filter(function (p) { return assignedIds.value.indexOf(p.id) >= 0; });
      });
      var dlgOptions = computed(function () {
        return posts.value.filter(function (p) { return !dlg.dept || p.dept === dlg.dept; });
      });
      function onDeptChange() { /* 仅过滤候选，不清空已勾选 */ }
      function refresh() { toastMsg('已刷新'); }
      function openAssign() {
        dlg.dept = '';
        dlg.picked = assignedIds.value.slice();
        dlg.visible = true;
      }
      function saveAssign() {
        assignedIds.value = dlg.picked.slice();
        dlg.visible = false;
        toastMsg('已提交（即时生效）：张三 的岗位分配已更新', 'success');
      }
      function unbind(row) {
        confirmAction('解绑岗位「' + row.name + '」？该用户将失去该岗位对应的角色权限。', function () {
          assignedIds.value = assignedIds.value.filter(function (id) { return id !== row.id; });
          if (primaryId.value === row.id) { primaryId.value = null; }
          toastMsg('已解绑（即时生效）', 'success');
        }, '解绑');
      }
      function onPrimary(row) {
        if (primaryId.value === row.id) {
          primaryId.value = null;
          toastMsg('已取消主要岗位（即时生效）', 'success');
          return;
        }
        primaryId.value = row.id;
        toastMsg('已设为主要岗位：「' + row.name + '」（即时生效，原主要项自动取消）', 'success');
      }
      return { activeTab, demoState, posts, assignedIds, primaryId, dlg, assignedRows, dlgOptions, onDeptChange, refresh, openAssign, saveAssign, unbind, onPrimary };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

</body>
</html>
